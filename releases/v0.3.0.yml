---
name: 'CLI: package manager prompt & installer'
tag_name: 'v0.3.0'
body: |
  Overview
  A new CLI feature was added to prompt users for their preferred package manager (npm, pnpm, yarn, bun or auto-detect) and automatically install project dependencies using the selected manager. The change adds a helper module to build and run install commands cross-platform, wires the prompt into the generator flow, and documents the behavior in the README.
  
  Highlights
  - New helper: src/cli/package-manager.ts — prompts for package manager, detects installed managers, and runs installs for deps/devDeps.
  - Integration: CLI now prompts for package manager during project creation and runs installers unless --no-install is passed.
  - Dev dependencies: added execa and inquirer for robust child-process handling and interactive prompts.
  - README updated to document package manager prompt and --no-install option.
  - Branch/PR: feat/add-package-manager-installer, PR titled "feat(cli): add package manager prompt + installer".
  
  Changelog
  - Added: package manager prompt and installer (supports npm, pnpm, yarn, bun, detect)
  - Added: src/cli/package-manager.ts
  - Updated: CLI flow to prompt and install; README docs
  - Added devDeps: execa, inquirer
  
  Upgrade steps
  1. Pull the latest changes.
  2. If you rely on a specific package manager, pass --no-install and run your manager manually, otherwise accept the prompt during generation.
  
  Notes
  - If you prefer a different integration point for prompting/installation, please review the PR branch feat/add-package-manager-installer and suggest changes.
---